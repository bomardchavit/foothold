name: release

# Push a tag (npm run release -- minor && git push --follow-tags) and this builds the installers,
# publishes them to the GitHub Release, and attaches the extension zip. The desktop app's updater
# reads that release, so shipping a tag updates everyone who already installed it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # electron-builder treats an empty CSC_LINK as a path, so the signing variables are only exported when
      # the certificate actually exists. Without them the build still publishes: macOS users get a Gatekeeper
      # warning and have to update by downloading, which is the honest trade until a Developer ID is added.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            {
              echo "CSC_LINK=$MAC_CSC_LINK"
              echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD"
              echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
            } >> "$GITHUB_ENV"
            [ -n "$APPLE_ID_SECRET" ] && {
              echo "APPLE_ID=$APPLE_ID_SECRET"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD_SECRET"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET"
            } >> "$GITHUB_ENV"
            echo "Signing with the provided Developer ID certificate."
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No MAC_CSC_LINK secret: publishing an unsigned build."
          fi
      - name: Build and publish installers
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repository variable: the deployed server new installs open on first launch.
          FOOTHOLD_APP_URL: ${{ vars.FOOTHOLD_APP_URL }}
        run: npm run release

  extension:
    name: extension zip
    needs: desktop
    runs-on: ubuntu-latest
    env:
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:extension
        env:
          FOOTHOLD_APP_URL: ${{ vars.FOOTHOLD_APP_URL }}
      - name: Attach the zip to the release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release upload "${GITHUB_REF_NAME}" apps/extension/release/*.zip --clobber
      - name: Publish to the Chrome Web Store
        if: ${{ env.CHROME_CLIENT_ID != '' }}
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: npx --yes chrome-webstore-upload-cli@3 upload --source apps/extension/release/*.zip --auto-publish
