name: deploy

# Every push to main that passes CI ships the server. The desktop app and the extension talk to this
# deployment, so a server change reaches every user without anyone downloading anything.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  image:
    name: build image
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fly:
    name: deploy to fly.io
    needs: image
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until Fly is connected
        if: ${{ env.FLY_API_TOKEN == '' }}
        run: echo "FLY_API_TOKEN is not set, so nothing is deployed. Add it in Settings -> Secrets to turn this on."
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: ${{ env.FLY_API_TOKEN != '' }}
      - name: Deploy
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: flyctl deploy --remote-only --build-arg GIT_SHA=${{ github.sha }}
