<!doctype html>
<meta charset="utf-8" />
<title>Foothold</title>
<style>
  :root { --bg: #faf6ee; --fg: #2b2620; --muted: #6f6558; --line: #e4dbcc; --card: #fffdf8; --primary: #b4562c; --primary-fg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #26221e; --fg: #f2ece1; --muted: #a9a093; --line: #3b352e; --card: #2e2924; --primary: #d87a4a; --primary-fg: #1b1714; } }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-app-region: drag; }
  main { width: min(460px, calc(100vw - 48px)); -webkit-app-region: no-drag; }
  .mark { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .mark i { position: relative; width: 24px; height: 24px; display: block; }
  .mark i span { position: absolute; border-radius: 3px; background: var(--primary); }
  .mark i span:nth-child(1) { left: 0; bottom: 0; width: 24px; height: 10px; }
  .mark i span:nth-child(2) { left: 6px; bottom: 10px; width: 18px; height: 10px; opacity: .7; }
  .mark i span:nth-child(3) { left: 12px; bottom: 20px; width: 12px; height: 4px; opacity: .4; }
  .mark b { font: 600 20px/1 ui-serif, Georgia, "Times New Roman", serif; letter-spacing: -.01em; }
  h1 { font: 400 26px/1.25 ui-serif, Georgia, "Times New Roman", serif; margin: 0 0 8px; }
  p { margin: 0 0 18px; color: var(--muted); }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: inherit; font: inherit; }
  input:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  button { height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid transparent; font: 600 14px/1 inherit; cursor: pointer; }
  .primary { background: var(--primary); color: var(--primary-fg); }
  .ghost { background: transparent; color: inherit; border-color: var(--line); }
  button:disabled { opacity: .6; cursor: default; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .hint a { color: inherit; }
  .err { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 10px; font-size: 13px;
    background: color-mix(in oklab, var(--primary) 12%, transparent); border: 1px solid color-mix(in oklab, var(--primary) 35%, transparent); }
  .err.show { display: block; }
  code { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; }
</style>
<main>
  <div class="mark"><i><span></span><span></span><span></span></i><b>Foothold</b></div>
  <h1 id="title">Connect to your Foothold</h1>
  <p id="lede">Enter the address of your Foothold server. It is stored on this computer and you can change it later from the menu.</p>
  <form id="form">
    <label for="value" id="label">Server address</label>
    <input id="value" autocomplete="off" autocapitalize="off" spellcheck="false" />
    <div class="row">
      <button class="primary" id="submit" type="submit">Connect</button>
      <button class="ghost" id="secondary" type="button" hidden></button>
    </div>
  </form>
  <p class="hint" id="hint">Running it locally? Use <code>http://localhost:3000</code>.</p>
  <div class="err" id="err"></div>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const mode = q.get("mode") || "connect";
  const $ = (id) => document.getElementById(id);
  const err = (m) => { const e = $("err"); e.textContent = m; e.classList.add("show"); };
  const busy = (on, label) => { $("submit").disabled = on; $("submit").textContent = on ? label : $("submit").dataset.idle; };

  if (mode === "connect") {
    $("value").value = q.get("current") || "";
    $("value").placeholder = "https://foothold.example.com";
    $("submit").dataset.idle = "Connect";
  } else if (mode === "signin") {
    $("title").textContent = "Paste your sign-in link";
    $("lede").textContent = "Magic links open in your browser, not in this app. Copy the link from the email and paste it here to sign in inside Foothold.";
    $("label").textContent = "Sign-in link";
    $("value").placeholder = (q.get("server") || "https://…") + "/api/auth/callback/…";
    $("hint").textContent = "Signing in with Google works directly in this window.";
    $("submit").textContent = "Sign in";
    $("submit").dataset.idle = "Sign in";
    $("secondary").textContent = "Back";
    $("secondary").hidden = false;
    $("secondary").onclick = () => window.foothold.retry();
  } else {
    const target = q.get("url") || "";
    $("title").textContent = "Foothold is not reachable";
    $("lede").textContent = "The app could not load " + target + ".";
    $("form").hidden = true;
    $("hint").innerHTML = "Check that the server is running, then try again. " + (q.get("message") ? "<br>" + q.get("message") : "");
    $("secondary").hidden = false;
    $("secondary").textContent = "Change server";
    $("secondary").onclick = () => (location.search = "?mode=connect");
    const retry = document.createElement("button");
    retry.className = "primary";
    retry.textContent = "Try again";
    retry.onclick = () => window.foothold.retry();
    $("form").hidden = false;
    $("form").innerHTML = "";
    const row = document.createElement("div");
    row.className = "row";
    row.append(retry, $("secondary"));
    $("form").append(row);
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("err").classList.remove("show");
    const v = $("value").value;
    busy(true, mode === "signin" ? "Signing in…" : "Connecting…");
    const r = mode === "signin" ? await window.foothold.openSignInLink(v) : await window.foothold.connect(v);
    busy(false);
    if (!r.ok) err(r.error);
  });
  $("value").focus();
</script>
